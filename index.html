<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FRP Tunnel Manager</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: var(--tg-theme-bg-color, #17212b);
            color: var(--tg-theme-text-color, #f5f5f5);
            margin: 0; padding: 16px;
        }
        .card {
            background-color: var(--tg-theme-secondary-bg-color, #202b36);
            border-radius: 12px; padding: 14px; margin-bottom: 12px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
        }
        .btn {
            background-color: var(--tg-theme-button-color, #2f6ea5);
            color: var(--tg-theme-button-text-color, #ffffff);
            border: none; padding: 10px 16px; border-radius: 8px;
            cursor: pointer; width: 100%; font-size: 15px; font-weight: bold;
            margin-top: 8px;
        }
        .btn-danger { background-color: #e53935; }
        .btn-secondary { background-color: #546e7a; }
        .status { inline-size: fit-content; padding: 2px 8px; border-radius: 4px; font-size: 12px; font-weight: bold;}
        .active { background-color: #4caf50; color: white; }
        .expired { background-color: #f44336; color: white; }
        input, select {
            width: 100%; padding: 10px; margin: 6px 0 12px 0;
            border-radius: 6px; border: 1px solid #455a64;
            background: #2c3b47; color: white; box-sizing: border-box;
        }
        .tabs { display: flex; gap: 8px; margin-bottom: 16px; }
        .tab { flex: 1; padding: 8px; text-align: center; background: #2c3b47; border-radius: 6px; cursor: pointer; }
        .tab.active-tab { background: var(--tg-theme-button-color, #2f6ea5); }
        .hidden { display: none; }
        pre { background: #131c24; padding: 8px; border-radius: 6px; overflow-x: auto; font-size: 12px; }
    </style>
</head>
<body>

    <div id="user-block">
        <div class="tabs">
            <div class="tab active-tab" id="tab-my" onclick="switchTab('my')">Мои Туннели</div>
            <div class="tab" id="tab-buy" onclick="switchTab('buy')">Купить</div>
        </div>

        <div id="view-my">
            <h3>📋 Ваши активные подключения</h3>
            <div id="my-tunnels-list">Загрузка...</div>
        </div>

        <div id="view-buy" class="hidden">
            <h3>🛒 Приобрести новый туннель</h3>
            <div class="card">
                <label>Выберите тариф:</label>
                <select id="buy-plan">
                    <option value="7">⚡ 7 дней — 70 ₽</option>
                    <option value="30">🔥 30 дней — 300 ₽</option>
                    <option value="90">💎 90 дней — 600 ₽</option>
                </select>
                <label>Локальный порт (который на вашем ПК):</label>
                <input type="number" id="buy-lport" value="25565">
                <button class="btn" onclick="requestBuy()">Запросить покупку у админа</button>
            </div>
        </div>
    </div>

    <div id="admin-block" class="hidden">
        <hr style="border-color: #455a64; margin: 20px 0;">
        <h2>🛠️ Панель Администратора</h2>
        
        <div class="card">
            <h3>➕ Создать туннель</h3>
            <input type="number" id="adm-uid" placeholder="User ID">
            <input type="number" id="adm-lp" placeholder="Локальный порт (например 8080)">
            <select id="adm-days">
                <option value="7">7 дней</option>
                <option value="30">30 дней</option>
                <option value="90">90 дней</option>
            </select>
            <button class="btn" onclick="adminCreate()">Создать</button>
        </div>

        <div class="card">
            <h3>📡 Управление всеми туннелями</h3>
            <button class="btn btn-secondary" onclick="loadAdminTunnels()">Обновить список</button>
            <div id="admin-tunnels-list" style="margin-top: 12px;"></div>
        </div>
    </div>

    <script>
        const tg = window.Telegram.WebApp;
        tg.expand();

        const initData = tg.initData; 
        const userId = tg.initDataUnsafe?.user?.id;

        // Переключение вкладок юзера
        function switchTab(tab) {
            document.getElementById('tab-my').classList.toggle('active-tab', tab === 'my');
            document.getElementById('tab-buy').classList.toggle('active-tab', tab === 'buy');
            document.getElementById('view-my').classList.toggle('hidden', tab !== 'my');
            document.getElementById('view-buy').classList.toggle('hidden', tab !== 'buy');
        }

        // Загрузка туннелей пользователя
        async function loadUserTunnels() {
            if(!userId) return;
            try {
                const res = await fetch(`/api/my_tunnels?user_id=${userId}`);
                const tunnels = await res.json();
                const container = document.getElementById('my-tunnels-list');
                
                if(tunnels.length === 0) {
                    container.innerHTML = "<p>У вас пока нет туннелей.</p>";
                    return;
                }
                
                container.innerHTML = tunnels.map(t => `
                    <div class="card">
                        <div style="display:flex; justify-content:space-between; align-items:center;">
                            <strong>${t.frp_user}</strong>
                            <span class="status ${t.status}">${t.status === 'active' ? 'Активен' : 'Просрочен'}</span>
                        </div>
                        <p>🌍 Публичный адрес: <code>103.110.64.169:${t.remote_port}</code></p>
                        <p>🔗 Локальный порт: <code>${t.local_port}</code></p>
                        <p>📅 Осталось дней: <b>${t.days_left}</b></p>
                        <details>
                            <summary style="cursor:pointer; color:var(--tg-theme-link-color,#2481cc)">Показать конфиг .toml</summary>
                            <pre>${t.config}</pre>
                        </details>
                    </div>
                `).join('');
            } catch(e) { console.error(e); }
        }

        // Действие: Запросить покупку (отправляет данные обратно боту в чат)
        function requestBuy() {
            const plan = document.getElementById('buy-plan').value;
            const lport = document.getElementById('buy-lport').value;
            tg.sendData(JSON.stringify({action: "buy_request", plan: plan, local_port: lport}));
            tg.close();
        }

        // Проверка на админа и отрисовка админки
        async function checkAdmin() {
            try {
                const res = await fetch(`/api/is_admin?user_id=${userId}`);
                const data = await res.json();
                if(data.is_admin) {
                    document.getElementById('admin-block').classList.remove('hidden');
                    loadAdminTunnels();
                }
            } catch(e) { console.error(e); }
        }

        // Админка: Создать туннель
        async function adminCreate() {
            const uid = document.getElementById('adm-uid').value;
            const lp = document.getElementById('adm-lp').value;
            const days = document.getElementById('adm-days').value;
            
            if(!uid || !lp) return alert("Заполните поля");

            const res = await fetch('/api/admin/create', {
                method: 'POST',
                headers: {'Content-Type': 'application/json'},
                body: JSON.stringify({user_id: parseInt(uid), local_port: parseInt(lp), plan_days: parseInt(days)})
            });
            if(res.ok) {
                alert("Туннель успешно создан!");
                loadUserTunnels();
                loadAdminTunnels();
            } else { alert("Ошибка создания"); }
        }

        // Админка: Загрузить все туннели
        async function loadAdminTunnels() {
            const res = await fetch('/api/admin/tunnels');
            const tunnels = await res.json();
            const container = document.getElementById('admin-tunnels-list');
            
            container.innerHTML = tunnels.map(t => `
                <div class="card" style="border: 1px solid #37474f;">
                    <p>👤 Юзер: <b>@${t.username}</b> (ID: ${t.user_id})</p>
                    <p>🔑 FRP код: <code>${t.frp_user}</code> [${t.status}]</p>
                    <p>🌐 Порты: ${t.remote_port} -> ${t.local_port}</p>
                    <p>⏳ Истекает: ${t.expires_at}</p>
                    <div style="display:flex; gap:8px;">
                        <button class="btn" style="margin:0" onclick="adminExtend('${t.frp_user}')">Продлить 30д</button>
                        <button class="btn btn-danger" style="margin:0" onclick="adminDelete('${t.frp_user}')">Удалить</button>
                    </div>
                </div>
            `).join('');
        }

        async function adminExtend(frp_user) {
            await fetch('/api/admin/extend', {
                method: 'POST',
                headers: {'Content-Type': 'application/json'},
                body: JSON.stringify({frp_user: frp_user, days: 30})
            });
            loadAdminTunnels();
            loadUserTunnels();
        }

        async function adminDelete(frp_user) {
            if(confirm(`Удалить туннель ${frp_user}?`)) {
                await fetch(`/api/admin/delete?frp_user=${frp_user}`, {method: 'DELETE'});
                loadAdminTunnels();
                loadUserTunnels();
            }
        }

        // Запуск
        loadUserTunnels();
        checkAdmin();
    </script>
</body>
</html>
